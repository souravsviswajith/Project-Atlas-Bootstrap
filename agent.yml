          optional: true
        - id: "language.rust"
          software: "Rust stable toolchain"
          optional: true
        - id: "language.kotlin"
          software: "Kotlin toolchain"
          optional: true
        - id: "language.dart"
          software: "Dart SDK"
          optional: true
        - id: "framework.flutter"
          software: "Flutter SDK"
          optional: true
        - id: "language.swift"
          software: "Swift toolchain"
          optional: true
          notes:
            - "Respect platform restrictions and official toolchain availability, especially on Windows."
        - id: "language.php"
          software: "PHP"
          optional: true
        - id: "language.ruby"
          software: "Ruby"
          optional: true
        - id: "language.r"
          software: "R"
          optional: true
