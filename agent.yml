# Project Atlas Bootstrap — AI Agent Instructions
# Portable project contract. Adapt to a target agent's native format when needed.
# This file describes both the intended workstation inventory and the verified
# implementation status. An inventory entry is NOT proof that Atlas installs it.

schema_version: "1.1"

project:
  name: "Project Atlas Bootstrap"
  repository: "souravsviswajith/Project-Atlas-Bootstrap"
  purpose: >
    Prepare consistent developer workstations through a guided, configurable,
    dependency-aware setup process, with safe and reproducible provisioning
    as the long-term goal.
  primary_initial_target:
    os: windows
    version: "Windows 11 (22H2 or newer)"
    architecture: "x64; support arm64 only where each package supports it"
  future_supported_targets:
    - windows
    - macos
    - linux
  scope_note: >
    Windows 11 is the detailed initial provisioning baseline. macOS and Linux
    are part of the cross-platform product direction, but each OS needs its
    own researched package mapping, prerequisites, commands, and tests.
    Never copy Windows installation commands to another operating system.

agent:
  role: "Repository-aware software engineering, provisioning research, and documentation agent"
  mission: >
    Maintain and extend Atlas without losing its established workstation
    inventory, safety model, architecture, user workflows, or beginner-first
    documentation. Inspect the repository before making changes.
  priorities:
    - correctness
    - user safety
    - preservation of established decisions
    - maintainability
    - simplicity
    - accessibility
    - reproducibility

project_context:
  current_implementation:
    frontend:
      - "React 19"
      - "TypeScript 5.9"
      - "Vite 7"
      - "Tailwind CSS 4"
    package_manager: "npm"
    commands:
      install_project_dependencies: "npm ci"
      start: "npm run dev"
      typecheck: "npm run typecheck"
      test: "npm test"
      build: "npm run build"
      preview: "npm run preview"
  current_status:
    - "The repository currently contains a browser-based setup checklist and setup-plan preview."
    - "Checklist progress is stored in the browser."
    - "The capability catalogue and planner describe setup intent and preview plans."
    - "The planner is preview-only."
    - "There is no verified native installer, live host detector, OS provider, or host system-mutation runtime."
    - "The example YAML configuration is example input; do not claim the web app imports it unless source code proves that feature."
  critical_truths:
    - "Atlas currently does not install, update, repair, configure, or uninstall workstation software."
    - "A requested capability is not proof that software is installed."
    - "A checked checklist item is a user assertion, not machine verification."
    - "A planned provider is not an implemented installer."
    - "A preview plan is not an executed plan."
    - "The catalogue below is the intended provisioning scope, not a list of currently working installers."

# AUTHORITATIVE INTENDED WORKSTATION INVENTORY
# Treat this as the baseline scope to represent in the product and its planning
# model. Research exact versions and platform-specific installation methods
# before implementing any installer/provider.
provisioning_catalogue:
  installation_strategy:
    - "Use a declarative capability catalogue with stable IDs, versions, dependencies, platform support, and optionality."
    - "Let users select capabilities; do not install every catalogue item by default."
    - "Resolve dependencies and conflicts before generating a plan."
    - "Show the exact software, components, versions, package sources, and proposed actions in the plan."
    - "Prefer official vendor distributions and official package repositories."
    - "Pin versions when the user requests reproducibility; otherwise use a documented supported channel such as LTS or stable."
    - "Never silently add unrelated applications, telemetry agents, browser extensions, IDE extensions, or background services."
    - "Never install a second copy when a compatible installation is already detected."
    - "Provide update, repair, verification, and uninstall capabilities only as separately defined and authorized operations."
  phases:
    - id: "system-foundation"
      order: 10
      name: "Operating system preparation and system features"
      target: "Windows 11 first; OS-specific equivalents later"
      capabilities:
        - id: "system.windows.features"
          items:
            - "Check Windows version, architecture, available disk space, and required privileges."
            - "Check virtualization support and enablement state."
            - "WSL2 and required Windows components"
            - "Hyper-V or the appropriate virtualization feature when supported and selected"
            - "Windows Terminal"
            - "PowerShell 7"
          notes:
            - "Do not change power, security, privacy, firewall, Defender, BitLocker, or other system policies without an explicit user choice and a clear impact explanation."
            - "Do not enable optional Windows features automatically without preview and authorization."
        - id: "system.workspace-folders"
          items:
            - "Create the selected workspace root, with D:\Workspace as the documented Windows baseline."
            - "Create user-selected project folders under the workspace root."
            - "Keep source code, datasets, SDKs, containers, and caches in clearly named locations when the user chooses those locations."
          notes:
            - "Do not hard-code a drive letter if the user selected another drive."
            - "Never overwrite or delete existing folders."
    - id: "core-utilities"
      order: 20
      name: "Core developer and desktop utilities"
      capabilities:
        - id: "shell.powershell"
          software: "PowerShell 7"
          required_for_baseline: true
        - id: "terminal.windows-terminal"
          software: "Windows Terminal"
          required_for_baseline: true
        - id: "vcs.git"
          software: "Git"
          required_for_baseline: true
        - id: "github.cli"
          software: "GitHub CLI (gh)"
          required_for_baseline: true
        - id: "editor.vscode"
          software: "Visual Studio Code"
          required_for_baseline: true
          notes:
            - "Install the editor only when selected."
            - "Do not automatically install VS Code extensions; extension selection is a separate user-controlled task."
        - id: "utility.powertoys"
          software: "Microsoft PowerToys"
          optional: true
        - id: "utility.everything"
          software: "Everything search"
          optional: true
        - id: "archive.7zip"
          software: "7-Zip"
          optional: true
        - id: "media.vlc"
          software: "VLC media player"
          optional: true
        - id: "editor.notepadpp"
          software: "Notepad++"
          optional: true
        - id: "notes.obsidian"
          software: "Obsidian"
          optional: true
        - id: "vcs.git-lfs"
          software: "Git LFS"
          optional: true
      configuration:
        - "Offer Git identity and line-ending configuration as explicit user inputs."
        - "Offer GitHub CLI authentication as a separate interactive step; never collect or store tokens in Atlas configuration."
        - "Do not sign in to accounts or accept licenses on the user's behalf without explicit interaction."
    - id: "linux-environment"
      order: 30
      name: "Linux environment on Windows"
      capabilities:
        - id: "linux.wsl2"
          software: "Windows Subsystem for Linux 2"
          optional: true
        - id: "linux.ubuntu"
          software: "Ubuntu distribution for WSL2"
          optional: true
      notes:
        - "Check Windows edition, WSL prerequisites, virtualization, and reboot requirements."
        - "Distribution installation and first-run user creation require clear user guidance."
        - "Do not assume WSL2 is available on macOS or Linux; use native OS environments there."
    - id: "programming-languages-and-runtimes"
      order: 40
      name: "Programming languages, runtimes, SDKs, and build tools"
      capabilities:
        - id: "language.python"
