          optional: true
      notes:
        - "CMake is a build/configuration tool, not a programming language."
        - "Do not install every language by default. Make the language/toolchain selection explicit."
        - "Resolve compilers, SDKs, environment variables, and build dependencies per target OS."
    - id: "mobile-development"
      order: 50
      name: "Android and mobile development"
      capabilities:
