non_negotiable_rules:
  - "Read relevant source files before editing."
  - "Treat the repository implementation as the source of truth for current behavior."
  - "Do not infer implementation from README text, roadmap entries, comments, mock data, or type definitions alone."
  - "Do not invent files, commands, APIs, capabilities, tests, or successful results."
  - "Do not silently remove existing features, inventory items, project decisions, or user-facing workflows."
  - "Do not replace the current application with a new scaffold or unrelated template."
  - "Do not merge unrelated projects into Atlas."
  - "Do not make destructive changes without explaining impact and obtaining explicit approval."
  - "Do not execute installers, cleanup, deletion, privileged commands, or host-changing operations without explicit authorization."
  - "Keep secrets, tokens, credentials, private keys, and personal data out of source code, logs, examples, and commits."
  - "Prefer small, reviewable changes over broad rewrites."

operating_workflow:
  required_loop:
    - step: "Understand"
      actions:
        - "Read this file and relevant project documentation."
        - "Inspect repository tree, package scripts, configuration, source, and tests relevant to the task."
        - "Check current Git diff and recent history before changing existing work."
        - "Compare the requested change against the intended provisioning catalogue above."
    - step: "Research"
      actions:
        - "Use official vendor documentation and primary sources for platform, package, API, version, and security claims."
        - "Verify package names, supported versions, architectures, checksums/signatures where applicable, licensing, and installation prerequisites."
        - "Research each OS separately; record unsupported combinations rather than guessing."
        - "Check compatibility with the actual project and target OS versions."
    - step: "Plan"
      actions:
        - "State the intended change and identify affected files."
        - "List the exact applications, runtimes, SDKs, and components affected."
        - "Identify dependencies, conflicts, disk impact, privileges, reboot requirements, and security risks."
        - "Preserve existing behavior unless the task explicitly changes it."
    - step: "Implement"
      actions:
        - "Follow the existing architecture, naming, formatting, and component patterns."
        - "Keep modules focused and avoid unnecessary abstractions."
        - "Add or update tests for changed behavior."
        - "Keep catalogue metadata separate from executable provider implementations."
    - step: "Verify"
      actions:
        - "Run relevant tests and checks available in the repository."
        - "Run npm run typecheck, npm test, and npm run build when changes affect the application."
        - "Validate YAML syntax and schema when changing YAML configuration or this file, using a parser available in the project or an explicitly documented validation tool."
        - "Inspect the final diff for accidental changes, secrets, generated files, and documentation drift."
    - step: "Report"
      actions:
        - "Summarize what changed and why."
        - "List exact software/components added, changed, or removed."
        - "List files changed."
        - "Report exact checks run and their results."
        - "Clearly identify what is implemented, planned, unverified, unsupported, or blocked."

documentation_policy:
  audience_first:
    default_style: "Beginner-friendly plain English, step-by-step"
    principles:
      - "Assume the reader may be completely new to the subject."
      - "Explain what a feature does before explaining how it works."
      - "Explain unfamiliar terms in ordinary language when first introduced."
      - "Give exact steps, commands, expected results, and recovery steps."
      - "Do not make users understand internal architecture just to use Atlas."
      - "Avoid unexplained acronyms, dense paragraphs, and unnecessary jargon."
      - "Never sacrifice correctness or safety to make instructions shorter."
  document_types:
    readme:
      audience: "New users and first-time visitors"
      style: "Short, welcoming, beginner-friendly"
      must_cover:
        - "What Atlas is"
        - "What works today and what does not"
        - "The categories of software Atlas is intended to help install"
        - "Prerequisites and exact getting-started steps"
        - "How to use the current application"
        - "Safety limitations"
    installation_and_user_guides:
      audience: "People using Atlas"
      style: "Sequential, idiot-proof instructions with expected outcomes and troubleshooting"
    architecture_and_developer_docs:
      audience: "Developers and maintainers"
      style: "Technically precise, detailed, and evidence-based"
    research_docs:
      audience: "Developers and reviewers"
      style: "Source-backed, dated, explicit about uncertainty"
  documentation_guardrails:
    - "Do not turn the README into an engineering design document."
    - "Do not remove useful beginner instructions to make documentation more technical."
    - "Keep deep implementation details in architecture/developer docs."
    - "Keep user documentation consistent with verified application behavior."
    - "Label implemented, partially implemented, planned, proposed, and unverified features accurately."
    - "Never document a planned command or installer as if it currently works."
    - "When explaining the intended inventory, list actual software names and clearly state that the current app does not install them yet."

architecture_and_implementation:
  principles:
    - "Modular and configuration-driven design."
    - "Deterministic, dependency-aware planning."
    - "Explicit separation of desired state and observed state."
    - "Idempotency for future provisioning operations."
    - "Safe defaults, preview-first execution, and explicit authorization."
    - "Clear diagnostics and verifiable outcomes."
    - "Cross-platform behavior must be declared and tested per OS and architecture."
  state_model:
    declared: "What the user requested."
    observed: "What the system has actually detected."
    planned: "What Atlas proposes to do."
    executable: "What a verified provider implementation can perform."
    actual: "What was successfully changed and then verified."
  rules:
    - "Never treat declared state as observed state."
    - "Never treat a plan as execution."
    - "Never report success without operation and verification evidence."
    - "A capability is not executable merely because it exists in a catalogue."
    - "Check package manager, OS, distribution, architecture, version, privileges, and prerequisites before execution."
    - "Do not assume Windows instructions work on macOS or Linux."
    - "Do not assume Linux distributions use the same package manager."
    - "Do not run terraform apply, cloud resource creation, or Kubernetes mutations as workstation setup without explicit authorization."

security_and_safety:
  defaults:
    system_mutation: "disabled"
    privileged_operations: "require_explicit_authorization"
    destructive_operations: "require_explicit_authorization"
    network_services: "do_not_expose_by_default"
  requirements:
    - "Preview exact intended changes before execution."
    - "Explain elevated permissions and their consequences."
    - "Do not disable security protections as a convenience."
    - "Do not store passwords or service credentials in YAML examples or committed files."
    - "Use secure secret-management practices for future service configuration."
    - "Bind optional local development services to loopback by default."
    - "Do not start databases, containers, or network listeners during preview."
    - "Do not claim a restore point, backup, rollback, or recovery path exists unless verified."
    - "Show license/terms implications where they materially affect installation or use."

change_management:
  before_editing:
    - "Identify the authoritative source file for the behavior being changed."
    - "Check existing tests, callers, and related capability definitions."
    - "Check whether the requested change conflicts with an established project decision."
  during_editing:
    - "Avoid broad formatting or unrelated refactors."
    - "Preserve public interfaces unless a change is required and documented."
    - "Update tests and documentation when behavior changes."
  before_finishing:
    - "Review the complete diff."
    - "Check for stale or contradictory documentation."
    - "Confirm no unrelated files were changed."
    - "Do not claim a commit, push, deployment, or test succeeded unless the tool result confirms it."

communication:
  style:
    - "Be direct, precise, and calm."
    - "Use plain language for user-facing explanations."
    - "Use technical terminology in developer discussions when it improves precision."
    - "Explain important trade-offs and risks."
    - "Ask one focused question only when a missing requirement blocks safe progress."
  status_labels:
    implemented: "Verified in current source code or by a successful test."
    partial: "Some parts exist, but the full behavior is incomplete."
    planned: "Intended future feature with no verified implementation."
    proposed: "Suggestion not yet approved as a project decision."
    unverified: "Not yet checked against source code or runtime evidence."
    unsupported: "Known not to work for the selected target."

final_response:
  required:
    - "Task outcome."
    - "Exact software and components affected."
    - "Summary of implementation or documentation changes."
    - "Files affected."
    - "Verification performed and exact results."
    - "Known limitations and remaining work."
  prohibited:
    - "Do not claim unverified functionality."
    - "Do not hide failed checks."
    - "Do not present assumptions as project decisions."
