          status: "future capability; not currently implemented"
        - id: "maintenance.repair"
          software: "User-approved repair operations"
          status: "future capability; not currently implemented"
        - id: "maintenance.cleanup"
          software: "User-reviewed cache and temporary-file cleanup"
          status: "future capability; not currently implemented"
        - id: "maintenance.uninstall"
          software: "User-approved uninstall operations"
          status: "future capability; not currently implemented"
      notes:
        - "Never equate cleanup with deleting user data."
        - "Show exact paths, packages, and impact before cleanup or uninstall."
        - "Do not claim rollback or recovery unless implemented and tested."

  platform_mapping_requirements:
    windows:
      initial_baseline: true
      package_manager_strategy: "Research and select a supported package source per package; do not assume all tools use the same manager."
      special_cases:
        - "WSL2, Windows optional features, Hyper-V, and reboots need explicit prerequisite checks."
        - "Use nvm-windows for the Windows Node.js version-manager path."
        - "Use Docker Desktop only on supported configurations and respect its current licensing terms."
    macos:
      initial_baseline: false
      package_manager_strategy: "Research Homebrew and official vendor installers; use only where supported."
      special_cases:
        - "Xcode Command Line Tools and Apple platform SDK requirements must be checked for relevant development toolchains."
        - "Do not assume Windows utilities or installers have macOS equivalents."
    linux:
      initial_baseline: false
      package_manager_strategy: "Declare and test support separately for each distribution/package manager."
      supported_distribution_families_to_research:
        - debian
        - ubuntu
        - fedora
        - rhel
        - arch
      special_cases:
        - "Detect distribution and version before selecting commands."
        - "Distinguish Docker Engine from Docker Desktop."
        - "Do not assume package names or service-management commands are portable across distributions."

  inventory_representation_rules:
    - "Every installable item must have a stable capability ID, display name, category, platform support, version policy, optionality, dependencies, and source/provenance."
    - "Represent tools separately when they are independently selectable or have separate prerequisites; examples include Android Studio versus Android SDK, Docker versus Compose, and database client versus server."
    - "Show users the actual package/application names, not only abstract categories such as developer tools."
    - "For each planned install, show version/channel, target OS, package source, dependencies, disk impact when known, privilege requirements, and whether a restart is needed."
    - "Mark mandatory baseline components separately from optional components."
    - "Do not silently install optional tools."
    - "Do not invent versions, package IDs, download URLs, checksums, or compatibility claims."
    - "Record researched package-manager mappings and official sources in project documentation."
    - "Do not label an item installable until its provider exists and is tested on that OS/version/architecture."


# CLEAN-MACHINE BOOTSTRAP CONTRACT
# A fresh target machine is not a developer machine. Do not require the tools
# Atlas is meant to install to exist before Atlas can provision them.
fresh_system_bootstrap:
  baseline_assumptions:
    preinstalled_development_tools: []
    assume_nodejs: false
    assume_npm: false
    assume_python: false
    assume_go: false
    assume_java_jdk: false
    assume_git: false
    assume_docker: false
    assume_terraform: false
    assume_cloud_cli: false
    assume_third_party_package_manager: false
    assume_admin_or_root_access: false
    assume_internet_access: false
    assume_available_disk_space: false
  rules:
    - "Treat the target as a clean OS installation unless detection proves otherwise."
    - "Do not use Node.js, npm, Python, Go, Java, Git, Docker, Terraform, or a cloud CLI as an installer prerequisite when that same tool is part of the requested installation."
    - "Atlas must be able to bootstrap selected runtimes from a clean system; do not create a circular dependency where installing Node requires Node, installing Go requires Go, or installing Python requires Python."
    - "Do not assume winget, Chocolatey, Scoop, Homebrew, apt, dnf, yum, pacman, zypper, apk, or any other third-party/package manager exists. Detect and validate the selected provider first."
    - "Use OS-provided bootstrap capabilities only after checking their presence and version; otherwise use a documented, verified bootstrap path."
    - "The current React/Vite development workflow requires Node.js and npm, but this is a development prerequisite for running the current web app, not a prerequisite that may be imposed on the target workstation. Keep these two environments distinct."
    - "If the eventual native provisioning engine itself requires a runtime, either package that runtime with the engine or use a minimal OS-native bootstrapper; never assume the target already has it."
    - "Check OS edition/release, architecture, privileges, network/TLS access, disk space, existing installations, and reboot requirements before choosing installation actions."
    - "Bootstrap only the selected package manager or provider needed for the requested software. Do not install several competing package managers by default."
    - "Show bootstrap dependencies and all additional software in the plan before execution."
  execution_order:
    - "Detect operating system, release, architecture, shell, privilege level, and available disk."
    - "Discover built-in and already-installed package managers and runtimes without changing the machine."
    - "Resolve the smallest safe bootstrap path for the selected capabilities."
    - "Install or initialize only the required package provider, with explicit preview and authorization."
    - "Install foundational selected tools such as Git and language runtimes."
    - "Install dependent SDKs, DevOps tools, automation tools, cloud CLIs, and optional utilities."
    - "Apply only explicitly selected configuration steps."
    - "Verify each installation using its own version/check command and record evidence."
  platform_bootstrap:
    windows:
      native_entrypoint: "Windows PowerShell 5.1 where present; verify before use."
      package_providers_to_detect:
        - "Windows Package Manager (winget)"
        - "Chocolatey"
        - "Scoop"
      rules:
        - "Do not assume winget/App Installer is present or usable on every Windows image."
        - "Do not install Chocolatey or Scoop merely because winget is unavailable; select a provider according to the approved policy and user choice."
        - "Use official vendor installers or signed packages when no approved package provider is available."
        - "Handle UAC elevation and reboot requirements explicitly."
    macos:
      native_entrypoint: "Available system shell; verify environment."
      package_providers_to_detect:
        - "Homebrew"
        - "MacPorts"
      rules:
        - "Do not assume Homebrew or MacPorts is installed."
        - "Check Apple Silicon versus Intel architecture and package support."
        - "Use official vendor installation methods when no approved provider is available."
    linux:
      native_entrypoint: "Available system shell; verify environment."
      package_providers_to_detect:
        - "apt"
        - "dnf"
        - "yum"
        - "pacman"
        - "zypper"
        - "apk"
        - "emerge"
      rules:
        - "Identify distribution, release, architecture, and package manager before selecting commands."
        - "Do not use one distribution's package names or service commands on another distribution without verification."
        - "Do not assume sudo is installed or that the user has root privileges."
  installation_state:
    detect_before_install: true
    avoid_duplicate_installations: true
    preserve_existing_user_configuration: true
    never_overwrite_without_approval: true
    verify_after_install: true
    record:
      - "requested capability and resolved package"
      - "detected pre-existing version/state"
      - "selected provider and official source"
      - "installed version"
      - "verification command and result"
      - "reboot or manual action required"

