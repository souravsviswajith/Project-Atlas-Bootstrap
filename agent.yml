          optional: true
      notes:
        - "Android Studio, SDK components, emulator images, and device drivers are distinct installable components."
        - "Explain disk-space and virtualization requirements before downloading emulator images."
        - "Do not create or launch an emulator unless the user selects that action."
    - id: "cloud-and-devops"
      order: 60
