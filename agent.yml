        - id: "container.compose"
          software: "Docker Compose"
          optional: true
        - id: "kubernetes.kubectl"
          software: "kubectl"
          optional: true
        - id: "kubernetes.helm"
          software: "Helm"
          optional: true
        - id: "kubernetes.kind"
          software: "kind (Kubernetes in Docker)"
          optional: true
        - id: "kubernetes.k9s"
          software: "k9s"
          optional: true
      notes:
        - "Installing a CLI is not the same as configuring cloud credentials or deploying infrastructure."
        - "Authentication and account linking must be separate, interactive, and opt-in."
        - "Never run terraform apply, cloud resource creation, Kubernetes mutations, or cluster deployment as part of workstation setup without explicit authorization."
        - "Docker Desktop licensing, WSL integration, virtualization, and platform prerequisites must be checked against current official documentation."
    - id: "databases-and-local-services"
      order: 70
      name: "Database clients and optional containerized development services"
      capabilities:
        - id: "database.postgresql-client"
          software: "PostgreSQL client tools"
          optional: true
        - id: "database.mysql-client"
          software: "MySQL client tools"
          optional: true
        - id: "database.mongodb-tools"
          software: "MongoDB Database Tools / client"
          optional: true
        - id: "database.redis-tools"
          software: "Redis CLI/client tools"
          optional: true
        - id: "database.postgresql-container"
          software: "PostgreSQL development container"
          optional: true
        - id: "database.mysql-container"
          software: "MySQL development container"
          optional: true
        - id: "database.mongodb-container"
          software: "MongoDB development container"
          optional: true
        - id: "database.redis-container"
          software: "Redis development container"
          optional: true
      policy:
        preferred_local_service_model: "Containers managed through Docker/Compose"
        native_database_server_installation_on_windows: "Do not install by default; prefer containerized development services."
      notes:
        - "Database clients and database servers are separate capabilities."
        - "Do not pull images, create volumes, start containers, expose ports, or initialize databases during plan preview."
        - "Bind local development services to loopback by default."
        - "Explain persistent volume locations, ports, credentials, and data deletion risks before creating services."
    - id: "machine-learning-and-data-science"
      order: 80
      name: "Machine learning, data science, and computer vision environments"
